name: MBit VPN bot

on:
  schedule:
    - cron: "0 * * * *"   # каждый час: перезапуск после окончания предыдущего job
  workflow_dispatch:

# Только один экземпляр бота одновременно; новый запуск ждёт старый
concurrency:
  group: mbit-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mbit-bot/requirements.txt

      - run: pip install -r mbit-bot/requirements.txt

      - name: Restore DB
        uses: actions/cache/restore@v4
        with:
          path: mbit-bot/mbit.db
          key: mbit-db-${{ github.run_id }}
          restore-keys: mbit-db-

      - name: Run bot (stops gracefully before the 6h limit)
        working-directory: mbit-bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: timeout -s INT 20400 python bot.py || true

      - name: Save DB
        if: always()
        uses: actions/cache/save@v4
        with:
          path: mbit-bot/mbit.db
          key: mbit-db-${{ github.run_id }}
